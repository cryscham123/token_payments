services:
  test_network:
    container_name: test_network
    build:
      context: app/test_network
    env_file:
      - .env
    image: test_network
    init: true
    volumes:
      - "${PWD}/app/test_network/data:${TEST_NETWORK_DB_PATH}"
    ports:
      - "8545:8545"
    restart: always
    platform: linux/amd64

  postgres:
    container_name: postgres
    image: postgres:alpine
    restart: always
    init: true
    env_file:
      - .env
    volumes:
      - "${PWD}/app/postgres/data:/var/lib/postgresql"
      - "${PWD}/app/postgres/init.d:/docker-entrypoint-initdb.d"
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 10

  pgweb:
      container_name: pgweb
      image: sosedoff/pgweb
      restart: always
      environment:
        - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      env_file:
        - .env
      ports:
        - "8081:8081"
      depends_on:
        postgres:
          condition: service_healthy
