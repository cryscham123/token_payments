services:
  test_network:
    container_name: test_network
    build:
      context: app/test_network
    env_file:
      - .env
    image: test_network
    init: true
    volumes:
      - "${PWD}/app/test_network/data:${TEST_NETWORK_DB_PATH}"
    ports:
      - "8545:8545"
    restart: always
    platform: linux/amd64

  postgres:
    container_name: postgres
    image: postgres:alpine
    restart: always
    init: true
    env_file:
      - .env
    volumes:
      - "${PWD}/app/postgres/data:/var/lib/postgresql"
      - "${PWD}/app/postgres/init.d:/docker-entrypoint-initdb.d"
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 10

  pgweb:
      container_name: pgweb
      image: sosedoff/pgweb
      restart: always
      environment:
        - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      env_file:
        - .env
      ports:
        - "8081:8081"
      depends_on:
        postgres:
          condition: service_healthy

  kafka:
    container_name: kafka
    image: apache/kafka
    restart: always
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_LOG_DIRS=/var/lib/kafka/data

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    restart: always
    ports:
      - "8082:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_started

  token_payments_health:
    image: token_payments_runtime
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONPATH=/workspace/app
    command: ["python", "-m", "token_payments", "health"]
    restart: "no"
    profiles:
      - runtime
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      test_network:
        condition: service_started

  token_payments_worker:
    image: token_payments_runtime
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONPATH=/workspace/app
    command: ["python", "-m", "token_payments", "worker"]
    restart: "no"
    profiles:
      - runtime
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      test_network:
        condition: service_started

  token_payments_smoke:
    image: token_payments_runtime
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONPATH=/workspace/app
    command: ["python", "-m", "token_payments", "smoke", "compose-readiness"]
    restart: "no"
    profiles:
      - runtime
      - smoke
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      test_network:
        condition: service_started
