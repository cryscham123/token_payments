services:
  test_network:
    container_name: test_network
    build:
      context: app/test_network
    env_file:
      - path: .env
        required: false
    image: test_network
    init: true
    volumes:
      - "test_network_data:${TEST_NETWORK_DB_PATH}"
    ports:
      - "8545:8545"
    restart: always
    platform: linux/amd64

  postgres:
    container_name: postgres
    image: postgres:alpine
    restart: always
    init: true
    env_file:
      - path: .env
        required: false
    volumes:
      - postgres_data:/var/lib/postgresql
      - "${PWD}/app/postgres/init.d:/docker-entrypoint-initdb.d"
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 10

  postgres_seed:
    container_name: postgres_seed
    image: postgres:alpine
    restart: "no"
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      - BOOTSTRAP_POSTGRES_HOST=postgres
      - BOOTSTRAP_POSTGRES_PORT=5432
    volumes:
      - "${PWD}/app/postgres/init.d:/docker-entrypoint-initdb.d"
    command:
      [
        "sh",
        "-c",
        "sh /docker-entrypoint-initdb.d/002-token-payments-default-seed.sh && sh /docker-entrypoint-initdb.d/003-token-payments-demo-seed.sh",
      ]
    depends_on:
      postgres:
        condition: service_healthy

  pgweb:
      container_name: pgweb
      image: sosedoff/pgweb
      restart: always
      environment:
        - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      env_file:
        - path: .env
          required: false
      ports:
        - "8081:8081"
      depends_on:
        postgres:
          condition: service_healthy

  kafka:
    container_name: kafka
    image: apache/kafka
    restart: always
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_LOG_DIRS=/var/lib/kafka/data

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    restart: always
    ports:
      - "8082:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_started

  token_payments_health:
    image: token_payments_runtime
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONPATH=/workspace/app
    command: ["python", "-m", "token_payments", "health"]
    restart: "no"
    profiles:
      - runtime
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      test_network:
        condition: service_started

  token_payments_worker:
    image: token_payments_runtime
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONPATH=/workspace/app
    command: ["python", "-m", "token_payments", "worker"]
    restart: "no"
    profiles:
      - runtime
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      test_network:
        condition: service_started

  token_payments_live_worker:
    image: token_payments_runtime
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONPATH=/workspace/app
      - ADAPTER_POSTGRES_DSN=${ADAPTER_POSTGRES_DSN}
      - ADAPTER_KAFKA_BOOTSTRAP_SERVERS=${ADAPTER_KAFKA_BOOTSTRAP_SERVERS}
      - ADAPTER_KAFKA_CLIENT_ID=live-worker
      - RUNTIME_WORKER_BATCH_SIZE=${RUNTIME_WORKER_BATCH_SIZE:-100}
      - ADAPTER_KAFKA_REQUEST_TIMEOUT_SECONDS=${ADAPTER_KAFKA_REQUEST_TIMEOUT_SECONDS:-3.0}
      - ADAPTER_BLOCKCHAIN_RPC_SCHEME=${ADAPTER_BLOCKCHAIN_RPC_SCHEME}
      - ADAPTER_BLOCKCHAIN_RPC_HOST=${ADAPTER_BLOCKCHAIN_RPC_HOST}
      - ADAPTER_BLOCKCHAIN_RPC_PORT=${ADAPTER_BLOCKCHAIN_RPC_PORT}
      - ADAPTER_BLOCKCHAIN_RPC_PATH=${ADAPTER_BLOCKCHAIN_RPC_PATH:-}
      - ADAPTER_BLOCKCHAIN_RPC_URL=${ADAPTER_BLOCKCHAIN_RPC_URL:-}
    command: ["python", "-m", "token_payments", "worker", "--live", "--loop", "--confirm-live-worker"]
    restart: unless-stopped
    profiles:
      - runtime
      - api
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      test_network:
        condition: service_started

  token_payments_smoke:
    image: token_payments_runtime
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONPATH=/workspace/app
    command: ["python", "-m", "token_payments", "smoke", "compose-readiness"]
    restart: "no"
    profiles:
      - runtime
      - smoke
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      test_network:
        condition: service_started

  token_payments_api:
    image: token_payments_runtime
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONPATH=/workspace/app
      - LOCAL_API_ORIGIN=${LOCAL_API_ORIGIN}
      - API_PUBLIC_BASE_URL=${API_PUBLIC_BASE_URL}
      - RUNTIME_API_HOST=0.0.0.0
      - RUNTIME_API_PORT=8000
      - RUNTIME_REQUEST_TIMEOUT_SECONDS=${RUNTIME_REQUEST_TIMEOUT_SECONDS}
      - REQUEST_BODY_MAX_BYTES=${REQUEST_BODY_MAX_BYTES}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS}
      - CORS_MAX_AGE_SECONDS=${CORS_MAX_AGE_SECONDS}
      - COOKIE_SECURE=${COOKIE_SECURE}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE}
      - CSRF_ACTIVE_KEY_ID=${CSRF_ACTIVE_KEY_ID}
      - CSRF_SIGNING_KEY=${CSRF_SIGNING_KEY}
      - CSRF_MAX_AGE_SECONDS=${CSRF_MAX_AGE_SECONDS}
      - CSRF_COOKIE_NAME=${CSRF_COOKIE_NAME}
      - CSRF_HEADER_NAME=${CSRF_HEADER_NAME}
      - SESSION_ACTIVE_KEY_ID=${SESSION_ACTIVE_KEY_ID}
      - SESSION_SIGNING_KEYS=${SESSION_SIGNING_KEYS}
      - SESSION_ACCESS_TTL_SECONDS=${SESSION_ACCESS_TTL_SECONDS}
      - SESSION_REFRESH_TTL_SECONDS=${SESSION_REFRESH_TTL_SECONDS}
      - ADAPTER_POSTGRES_DSN=${ADAPTER_POSTGRES_DSN}
      - ADAPTER_KAFKA_BOOTSTRAP_SERVERS=${ADAPTER_KAFKA_BOOTSTRAP_SERVERS}
      - ADAPTER_BLOCKCHAIN_RPC_SCHEME=${ADAPTER_BLOCKCHAIN_RPC_SCHEME}
      - ADAPTER_BLOCKCHAIN_RPC_HOST=${ADAPTER_BLOCKCHAIN_RPC_HOST}
      - ADAPTER_BLOCKCHAIN_RPC_PORT=${ADAPTER_BLOCKCHAIN_RPC_PORT}
      - ADAPTER_BLOCKCHAIN_RPC_PATH=${ADAPTER_BLOCKCHAIN_RPC_PATH:-}
      - ADAPTER_BLOCKCHAIN_RPC_URL=${ADAPTER_BLOCKCHAIN_RPC_URL:-}
    command: ["python", "-m", "token_payments", "serve-api", "--live", "--confirm-live-api"]
    restart: unless-stopped
    profiles:
      - api
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      test_network:
        condition: service_started
      token_payments_live_worker:
        condition: service_started

  token_payments_web:
    image: token_payments_web
    build:
      context: frontend
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${API_PUBLIC_BASE_URL}
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "3000"]
    restart: unless-stopped
    profiles:
      - api
    expose:
      - "3000"
    depends_on:
      token_payments_api:
        condition: service_healthy

  nginx:
    container_name: nginx
    build:
      context: app/nginx
    env_file:
      - path: .env
        required: false
    image: nginx
    init: true
    volumes:
      - ./app/nginx/certs:/etc/ssl/certs
    ports:
      - 443:443
      - 80:80
    profiles:
      - api
    restart: always
    depends_on:
      token_payments_api:
        condition: service_healthy
      token_payments_web:
        condition: service_started

  redis:
    container_name: redis
    image: redis:alpine
    expose:
      - "6379"
    command: [ "redis-server" ]
    volumes:
      - ./app/redis/data:/data

  redisinsight:
    container_name: redisinsight
    image: redis/redisinsight
    ports:
      - 5540:5540
    depends_on:
      redis:
        condition: service_started

volumes:
  test_network_data:
  postgres_data:
