access_log off;
error_log /dev/null crit;

upstream token_payments_api {
    server token_payments_api:8000;
    keepalive 16;
}

upstream token_payments_web {
    server token_payments_web:3000;
    keepalive 16;
}

# Per-IP rate limit for the unauthenticated SIWE/wallet challenge endpoints to curb
# challenge-spam (DoS / auth_login_challenges table bloat). Generous enough for real logins.
limit_req_zone $binary_remote_addr zone=auth_challenges:10m rate=30r/m;
limit_req_status 429;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ${HOST};

    ssl_certificate /etc/ssl/certs/server.crt;
    ssl_certificate_key /etc/ssl/certs/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # Baseline security headers (inherited by all locations since none set their own add_header):
    # block clickjacking, MIME sniffing, and referer leakage. HSTS is intentionally omitted so
    # a self-signed localhost cert stays click-through-able during local development.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ ^/orders(/|$) {
        error_page 418 = @orders_api;
        recursive_error_pages on;

        if ($request_method = POST) {
            return 418;
        }

        proxy_pass http://token_payments_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location @orders_api {
        proxy_pass http://token_payments_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ~ ^/stores/?$ {
        error_page 418 = @stores_api_target;
        recursive_error_pages on;

        if ($http_accept ~* "json") {
            return 418;
        }
        if ($http_sec_fetch_mode = "cors") {
            return 418;
        }

        proxy_pass http://token_payments_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ~ ^/stores/[^/]+$ {
        error_page 418 = @stores_api_target;
        recursive_error_pages on;

        if ($http_accept ~* "json") {
            return 418;
        }
        if ($http_sec_fetch_mode = "cors") {
            return 418;
        }

        proxy_pass http://token_payments_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location @stores_api_target {
        proxy_pass http://token_payments_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ~ ^/products/ {
        proxy_pass http://token_payments_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ~ ^/products(/|$) {
        proxy_pass http://token_payments_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Rate-limited challenge endpoints (must precede the general /auth location so it matches first).
    location ~ ^/auth/(challenges|wallets/challenges)$ {
        limit_req zone=auth_challenges burst=10 nodelay;
        proxy_pass http://token_payments_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ~ ^/merchant(/|$) {
        error_page 418 = @merchant_api_target;
        recursive_error_pages on;

        if ($http_accept ~* "json") {
            return 418;
        }
        if ($http_sec_fetch_mode = "cors") {
            return 418;
        }

        proxy_pass http://token_payments_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location @merchant_api_target {
        proxy_pass http://token_payments_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ~ ^/(auth|checkouts?|payments|stores|admin|operator|healthz|readyz)(/|$) {
        proxy_pass http://token_payments_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /testnet-rpc {
        proxy_pass http://test_network:8545/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        proxy_pass http://token_payments_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ${HOST};
    return 301 https://$server_name$request_uri;
}
