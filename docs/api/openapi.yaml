  /payments:
    get:
      summary: List user payment history
      description: |
        Lists every payment owned by the authenticated user. The API filters by session user and never accepts another user's id in the request body.
      tags:
      - payments
      operationId: listUserPayments
      parameters:
      - $ref: '#/components/parameters/XRequestIdHeader'
      - $ref: '#/components/parameters/LocalUserIdHeader'
      - name: status
        in: query
        required: false
        description: Optional comma-separated payment status filter.
        schema:
          type: string
          example: SUBMITTED,CONFIRMED
      - name: limit
        in: query
        required: false
        description: Bounded page size for payment history. Defaults to 50 and accepts 1 through 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Payment history owned by the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentHistoryResponse'
              example:
                payments:
                - paymentId: <payment-id>
                  orderId: <order-id>
                  trackingId: <tracking-id>
                  status: SUBMITTED
                  currentStep: RECEIPT_PENDING
                  pendingAction: WAIT_FOR_RECEIPT
                  amount:
                    amount: '25.00'
                    symbol: USDC
                    chainId: 11155111
                    tokenAddress: '0x3333333333333333333333333333333333333333'
                    decimals: 6
                  chain:
                    chainId: 11155111
                    name: Sepolia
                  paymentAssetId: local-usdc
                  txHash: <local-test-network-transaction-hash>
                  receipt: null
                  failureReason: null
                  updatedAt: <timestamp>
                pagination:
                  limit: 50
                  nextPageToken: null
        '400':
          description: 'Validation error, malformed JSON, missing required input, unsupported enum, or rejected request shape.
            Possible error codes: VALIDATION_ERROR.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Validation error, malformed JSON, missing required input, unsupported enum, or rejected request
