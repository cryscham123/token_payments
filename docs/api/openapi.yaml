openapi: 3.0.3
info:
  title: Token Payments API
  version: 0.27.0
  description: >
    # Token Payments API


    Token Payments public HTTP API documents the local crypto checkout backend:
    SIWE login, OAuth identity linking, multi-wallet checkout, public catalog
    reads, merchant product and inventory operations, RBAC membership APIs, and
    operator recovery actions.


    This OpenAPI reference is tailored for GitBook. GitBook reads this file and
    creates a navigable API reference from tags, operations, schemas, examples,
    and the `x-codeSamples` snippets below.


    ### How this reference works


    - **Route manifest parity** - every operation mirrors the 54 public routes
    from `app/token_payments/api/http.py`.

    - **Page groups** - high-level tags such as *Commerce*, *Merchant*, and
    *Operations* group related endpoint pages in GitBook.

    - **Readable onboarding** - the sections below use GitBook tabs, hints, and
    stepper blocks so integrators can start from base URL, auth, and the happy
    path before opening individual endpoint pages.

    - **Public boundary** - `/healthz` and `/readyz` are live server system
    routes and intentionally stay outside this public API reference.

    - **Try it safety** - operator write actions are marked with
    `x-hideTryItPanel` because they are recovery operations for controlled
    environments.


    ## Servers & Authentication


    ### Servers


    {% tabs %}

    {% tab title="Local API" %}

    **Base URL**

    `http://127.0.0.1:8000`

    Use this when the live API server is started intentionally for local
    integration testing.

    {% endtab %}


    {% tab title="Docker alias" %}

    **Base URL**

    `http://localhost:8000`

    Use this from local tooling or Postman when Docker Compose exposes the API
    on the default host port.

    {% endtab %}

    {% endtabs %}


    {% hint style="info" %}

    Default `api` and `serve-api` commands keep the no-server-start preview
    boundary. Start a long-running live server only with
    `PYTHONPATH=app python3 -m token_payments serve-api --live --confirm-live-api`
    in an approved environment.

    {% endhint %}


    ### Authentication


    Browser clients authenticate with signed HttpOnly session cookies. Mutating
    cookie-authenticated requests also send `X-CSRF-Token`.


    Non-browser integration tests may use bearer-style local session context
    where explicitly supported by the runtime:


    ```http
    Authorization: Bearer YOUR_LOCAL_ACCESS_TOKEN
    X-CSRF-Token: YOUR_CSRF_TOKEN
    Idempotency-Key: stable-command-key
    ```


    {% hint style="warning" %}

    `X-User-Id` and `X-User-Scopes` are local/dev fallback headers only. Live or
    production paths must not trust them as authentication.

    {% endhint %}


    ## Getting started


    {% stepper %}

    {% step %}

    ## Request a login challenge

    Call `POST /auth/challenges` with the wallet address that will sign the
    SIWE message.

    {% endstep %}


    {% step %}

    ## Create a session

    Submit the signed SIWE message to `POST /auth/sessions`. The server returns
    session metadata and sets signed cookies plus a CSRF token for browser
    writes.

    {% endstep %}


    {% step %}

    ## Create and track checkout

    Call `POST /orders`, then use `GET /checkouts/tracking/{trackingId}` as the
    customer-safe polling surface.

    {% endstep %}


    {% step %}

    ## Submit payment evidence

    Send the blockchain transaction hash to `POST /payments/transaction-hashes`.
    The public API uses `trackingId` instead of exposing internal order or
    payment ids.

    {% endstep %}

    {% endstepper %}


    ## Error responses


    Errors use a bounded JSON envelope. Messages are safe for clients and do not
    include raw signatures, provider tokens, signed cookies, private ids, or
    adapter stack traces.


    ```json
    {
      "error": {
        "code": "VALIDATION_ERROR",
        "message": "request body is invalid",
        "status": 400
      }
    }
    ```


    | Status | Meaning |
    |--------|---------|
    | `400` | Malformed or invalid request body |
    | `401` | Missing or invalid session |
    | `403` | Missing CSRF token, permission, or scoped membership |
    | `404` | Resource not found in the caller's visible scope |
    | `405` | Method is not allowed for the path |
    | `409` | Idempotency conflict or business state conflict |
    | `413` | Request body is too large |
    | `500` | Bounded server error |
servers:
  - url: http://127.0.0.1:8000
    description: Local API server
    x-gitbook-description-html: <p>Local API server</p>
  - url: http://localhost:8000
    description: Docker Compose local alias
    x-gitbook-description-html: <p>Docker Compose local alias</p>
security:
  - cookieAuth: []
  - bearerAuth: []
