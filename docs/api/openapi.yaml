paths:
  /auth/challenges:
    post:
      summary: Request login challenge
      description: |
        Creates a SIWE login challenge for an EOA or supported ERC-1271 smart contract wallet.
      tags:
      - auth
      operationId: requestLoginChallenge
      security: []
      requestBody:
        $ref: '#/components/requestBodies/LoginChallengeRequest'
      responses:
        '201':
          description: Resource or command record created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthChallenge'
              example:
                walletAddress: '0x1111111111111111111111111111111111111111'
                domain: token-payments.local
                address: '0x1111111111111111111111111111111111111111'
                uri: https://token-payments.local
                version: '1'
                chainId: 1337
                nonce: N0NCE001
                issuedAt: '2026-05-17T10:00:00+09:00'
                expirationTime: '2026-05-17T10:30:00+09:00'
                signingMessage: <redacted-siwe-personal-sign-message>
                signatureVerification:
                  messageFormat: SIWE_V1
                  signatureVerificationMethod: SIWE_PERSONAL_SIGN_EOA_OR_ERC1271
                  supportedWalletTypes:
                  - EOA
                  - DEPLOYED_SMART_WALLET
                  smartWalletStandard: ERC-1271
                  erc1271MagicValue: '0x1626ba7e'
                  requiresDeployedCode: true
                  erc6492: future_scope
                csrfToken: <redacted-signed-csrf-token>
        '400':
          description: 'Validation error, malformed JSON, missing required input, unsupported enum, or rejected request shape.
            Possible error codes: VALIDATION_ERROR.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Validation error, malformed JSON, missing required input, unsupported enum, or rejected request
                    shape.
                  status: 400
        '413':
          description: Request body exceeds the bounded JSON body size policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: ERROR
                  message: Request body exceeds the bounded JSON body size policy.
                  status: 413
      x-codeSamples:
      - lang: cURL
        label: CLI
        source: |
          curl -L http://127.0.0.1:8000/auth/challenges \
            -H 'Content-Type: application/json' \
            -d '{"walletAddress":"0x0000000000000000000000000000000000000001"}'
      parameters:
      - $ref: '#/components/parameters/XRequestIdHeader'
      x-errorCodes:
      - status: 400
        codes:
        - VALIDATION_ERROR
  /auth/sessions:
    post:
      summary: Create SIWE session
      description: Verifies the signed SIWE message and creates a cookie-backed session.
      tags:
      - auth
      operationId: loginWithMetaMask
      security: []
      requestBody:
        $ref: '#/components/requestBodies/LoginSessionRequest'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
              example:
                token:
                  accessToken: <set-cookie>
                  refreshToken: <set-cookie>
                  transport: cookie
                signatureVerification:
                  messageFormat: SIWE_V1
                  signatureVerificationMethod: SIWE_PERSONAL_SIGN_EOA_OR_ERC1271
                  supportedWalletTypes:
                  - EOA
                  - DEPLOYED_SMART_WALLET
                  smartWalletStandard: ERC-1271
                  erc1271MagicValue: '0x1626ba7e'
                  requiresDeployedCode: true
                  erc6492: future_scope
                session:
                  userId: <user-id>
                  walletAddress: <wallet-address>
                  deviceId: <device-id>
                  expiresAt: <timestamp>
                  revokedAt: null
        '400':
          description: 'Validation error, malformed JSON, missing required input, unsupported enum, or rejected request shape.
            Possible error codes: VALIDATION_ERROR.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Validation error, malformed JSON, missing required input, unsupported enum, or rejected request
                    shape.
                  status: 400
        '401':
          description: 'Authentication is missing, invalid, expired, or required for the requested operation. Possible error
            codes: INVALID_SIGNATURE, WALLET_MISMATCH, SIWE_MESSAGE_MISMATCH.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_SIGNATURE
                  message: Authentication is missing, invalid, expired, or required for the requested operation.
                  status: 401
        '409':
          description: 'Idempotency conflict or domain state conflict. Possible error codes: EXPIRED_CHALLENGE, REUSED_NONCE.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: EXPIRED_CHALLENGE
                  message: Idempotency conflict or domain state conflict.
                  status: 409
        '413':
          description: Request body exceeds the bounded JSON body size policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: ERROR
                  message: Request body exceeds the bounded JSON body size policy.
                  status: 413
      x-codeSamples:
      - lang: JavaScript
        label: Fetch
        source: |
          const response = await fetch('http://127.0.0.1:8000/auth/sessions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ message, signature })
          });
          const session = await response.json();
      parameters:
      - $ref: '#/components/parameters/XRequestIdHeader'
      x-errorCodes:
      - status: 400
        codes:
        - VALIDATION_ERROR
      - status: 401
        codes:
        - INVALID_SIGNATURE
        - WALLET_MISMATCH
        - SIWE_MESSAGE_MISMATCH
      - status: 409
        codes:
        - EXPIRED_CHALLENGE
        - REUSED_NONCE
    delete:
      summary: Logout
      description: Expires the current signed session cookies.
      tags:
      - auth
      operationId: logout
      responses:
        '200':
          description: Successful logout response from the current framework-neutral facade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
              example:
                session:
                  userId: user-001
                  walletAddress: '0x1111111111111111111111111111111111111111'
                  deviceId: browser-1
                  expiresAt: '2026-06-16T10:00:00+09:00'
                  revokedAt: '2026-05-17T10:10:00+09:00'
        '204':
          description: Legacy Postman expected-response compatibility for clients that treat logout as no-content.
        '400':
          description: 'Validation error, malformed JSON, missing required input, unsupported enum, or rejected request shape.
            Possible error codes: VALIDATION_ERROR.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Validation error, malformed JSON, missing required input, unsupported enum, or rejected request
                    shape.
                  status: 400
        '401':
          description: 'Authentication is missing, invalid, expired, or required for the requested operation. Possible error
            codes: AUTHENTICATION_REQUIRED.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: AUTHENTICATION_REQUIRED
                  message: Authentication is missing, invalid, expired, or required for the requested operation.
                  status: 401
      parameters:
      - $ref: '#/components/parameters/XRequestIdHeader'
      - $ref: '#/components/parameters/LocalUserIdHeader'
      - $ref: '#/components/parameters/LocalScopesHeader'
      - $ref: '#/components/parameters/CsrfTokenHeader'
      x-errorCodes:
      - status: 400
        codes:
        - VALIDATION_ERROR
      - status: 401
        codes:
        - AUTHENTICATION_REQUIRED
  /auth/sessions/refresh:
    post:
      summary: Refresh session
      description: Rotates the session using the signed refresh cookie.
      tags:
      - auth
      operationId: refreshSession
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
              example:
                token:
                  transport: cookie
                signatureVerification:
                  messageFormat: SIWE_V1
                  signatureVerificationMethod: SIWE_PERSONAL_SIGN_EOA_OR_ERC1271
                  supportedWalletTypes:
                  - EOA
                  - DEPLOYED_SMART_WALLET
                  smartWalletStandard: ERC-1271
                  erc1271MagicValue: '0x1626ba7e'
                  requiresDeployedCode: true
                  erc6492: future_scope
                csrfToken: <redacted-signed-csrf-token>
        '400':
          description: 'Validation error, malformed JSON, missing required input, unsupported enum, or rejected request shape.
            Possible error codes: VALIDATION_ERROR.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Validation error, malformed JSON, missing required input, unsupported enum, or rejected request
                    shape.
                  status: 400
        '401':
          description: 'Authentication is missing, invalid, expired, or required for the requested operation. Possible error
            codes: INVALID_SIGNATURE.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: INVALID_SIGNATURE
                  message: Authentication is missing, invalid, expired, or required for the requested operation.
                  status: 401
        '409':
          description: 'Idempotency conflict or domain state conflict. Possible error codes: EXPIRED_CHALLENGE.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: EXPIRED_CHALLENGE
                  message: Idempotency conflict or domain state conflict.
                  status: 409
        '413':
          description: Request body exceeds the bounded JSON body size policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: ERROR
                  message: Request body exceeds the bounded JSON body size policy.
                  status: 413
      parameters:
      - $ref: '#/components/parameters/XRequestIdHeader'
      - $ref: '#/components/parameters/LocalUserIdHeader'
      - $ref: '#/components/parameters/LocalScopesHeader'
      - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        $ref: '#/components/requestBodies/RefreshSessionRequest'
      x-errorCodes:
      - status: 400
        codes:
        - VALIDATION_ERROR
      - status: 401
        codes:
        - INVALID_SIGNATURE
      - status: 409
        codes:
        - EXPIRED_CHALLENGE
  /auth/me:
    get:
      summary: Get current user
      description: Returns the authenticated user summary without private provider subjects or signed token values.
      tags:
      - user
      operationId: getCurrentUser
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
              example:
                walletAddress: '0x1111111111111111111111111111111111111111'
                activeGroupId: <personal-group-id>
                scopes:
                - user:self
        '400':
          description: 'Validation error, malformed JSON, missing required input, unsupported enum, or rejected request shape.
            Possible error codes: VALIDATION_ERROR.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Validation error, malformed JSON, missing required input, unsupported enum, or rejected request
                    shape.
                  status: 400
        '404':
          description: 'The requested resource does not exist or is not visible in the caller scope. Possible error codes:
            USER_NOT_FOUND.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: USER_NOT_FOUND
                  message: The requested resource does not exist or is not visible in the caller scope.
                  status: 404
      parameters:
      - $ref: '#/components/parameters/XRequestIdHeader'
      - $ref: '#/components/parameters/userIdQuery'
      - $ref: '#/components/parameters/LocalUserIdHeader'
      - $ref: '#/components/parameters/LocalScopesHeader'
      x-errorCodes:
      - status: 400
        codes:
        - VALIDATION_ERROR
      - status: 404
        codes:
        - USER_NOT_FOUND
  /auth/me/profile:
    get:
      summary: Get current user profile
      description: Returns optional bounded display profile data for the current user.
      tags:
      - user
      operationId: getCurrentUserProfile
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
              example:
                profile:
                  userId: <user-id>
                  displayName: Postman User
                  displayNameHtml: Postman User
                  status: ACTIVE
                  createdAt: <timestamp>
                  updatedAt: <timestamp>
        '401':
          description: 'Authentication is missing, invalid, expired, or required for the requested operation. Possible error
            codes: AUTHENTICATION_REQUIRED.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: AUTHENTICATION_REQUIRED
                  message: Authentication is missing, invalid, expired, or required for the requested operation.
                  status: 401
        '404':
          description: 'The requested resource does not exist or is not visible in the caller scope. Possible error codes:
            USER_PROFILE_NOT_FOUND.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: USER_PROFILE_NOT_FOUND
                  message: The requested resource does not exist or is not visible in the caller scope.
                  status: 404
      parameters:
      - $ref: '#/components/parameters/XRequestIdHeader'
      - $ref: '#/components/parameters/LocalUserIdHeader'
      - $ref: '#/components/parameters/LocalScopesHeader'
      x-errorCodes:
      - status: 401
        codes:
        - AUTHENTICATION_REQUIRED
      - status: 404
        codes:
        - USER_PROFILE_NOT_FOUND
    patch:
      summary: Update current user profile
      description: Updates bounded display profile data only; email and provider claims are not persisted.
      tags:
      - user
      operationId: updateCurrentUserProfile
      requestBody:
        $ref: '#/components/requestBodies/UserProfileUpdateRequest'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
              example:
                profile:
                  userId: <user-id>
                  displayName: Postman User
                  displayNameHtml: Postman User
                  status: ACTIVE
                  createdAt: <timestamp>
                  updatedAt: <timestamp>
        '400':
          description: 'Validation error, malformed JSON, missing required input, unsupported enum, or rejected request shape.
            Possible error codes: VALIDATION_ERROR.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Validation error, malformed JSON, missing required input, unsupported enum, or rejected request
                    shape.
                  status: 400
        '401':
          description: 'Authentication is missing, invalid, expired, or required for the requested operation. Possible error
            codes: AUTHENTICATION_REQUIRED.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: AUTHENTICATION_REQUIRED
