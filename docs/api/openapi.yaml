    UserProfileUpdateRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserProfileUpdateRequest'
          example:
            displayName: Postman User
    AdminStoreUserRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminStoreUserRequest'
          example:
            walletAddress: '0x1111111111111111111111111111111111111111'
    AdminStoreCreateRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminStoreCreateRequest'
          example:
            ownerUserId: user-001
            storeWalletAddress: '0x2222222222222222222222222222222222222222'
            supportedChainIds:
            - 1337
            displayName: Demo Store
    AdminStoreMembershipRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminStoreMembershipRequest'
          example:
            userId: user-001
            roleId: MERCHANT_MANAGER
            active: true
    ProductCreateRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductCreateRequest'
          example:
            title: Local Hoodie
            price:
              amount: '10.000000000000000000'
              symbol: TPAY
              chainId: 1337
              tokenAddress: null
              decimals: 18
            initialTotalStock: 25
            visibility: PUBLIC
    ProductUpdateRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProductUpdateRequest'
          example:
            title: Local Hoodie v2
            visibility: PUBLIC
    InventoryIncreaseRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InventoryIncreaseRequest'
          example:
            quantity: 5
            reason: new stock intake
    InventoryCorrectionRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InventoryCorrectionRequest'
          example:
            targetTotalStock: 20
            reason: cycle count correction
    InventorySaleToggleRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InventorySaleToggleRequest'
          example:
            reason: manual sale availability change
    MerchantInvitationCreateRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MerchantInvitationCreateRequest'
          example:
            roleId: MERCHANT_STAFF
            targetWallet: '0x5555555555555555555555555555555555555555'
    MerchantInvitationAcceptRequest:
      required: false
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MerchantInvitationAcceptRequest'
          example:
            walletAddress: '0x5555555555555555555555555555555555555555'
    MerchantMemberRoleUpdateRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MerchantMemberRoleUpdateRequest'
          example:
            roleId: MERCHANT_MANAGER
    OperatorCancelOrderRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OperatorCancelOrderRequest'
          example:
            reason: customer requested cancellation
            parameters:
              notifyCustomer: true
    OperatorOutboxActionRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OperatorOutboxActionRequest'
          example:
            kind: EVENT
            reason: broker recovered
            parameters:
              maxAttempts: 1
  schemas:
    JsonObject:
      type: object
      additionalProperties: true
    AuthChallenge:
      type: object
      properties:
        challengeId:
          type: string
        message:
          type: string
        csrfToken:
          type: string
    OperatorDashboard:
      type: object
      properties:
        orders:
          type: array
          items:
            type: object
        payments:
          type: array
          items:
            type: object
        outbox:
          type: array
          items:
            type: object
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
              description: Machine-readable bounded error code.
              x-gitbook-description-html: <p>Machine-readable bounded error code.</p>
            message:
              type: string
              example: request body is invalid
              description: Safe human-readable message.
              x-gitbook-description-html: <p>Safe human-readable message.</p>
            status:
              type: integer
              example: 400
              description: HTTP status code when available.
              x-gitbook-description-html: <p>HTTP status code when available.</p>
    CryptoAmount:
      type: object
      required:
      - amount
      - symbol
      - chainId
      - decimals
      properties:
        amount:
          type: string
          description: Decimal amount rendered as a string to preserve precision.
          example: '25.00'
        symbol:
          type: string
          description: Currency or token symbol.
          example: USDC
        chainId:
          type: integer
          description: Chain id for this amount.
          example: 11155111
        tokenAddress:
          type: string
          nullable: true
          description: Token contract address, or null for the native asset.
          example: '0x3333333333333333333333333333333333333333'
        decimals:
          type: integer
          description: Asset decimal precision.
          example: 6
    ChainSummary:
      type: object
      required:
      - chainId
      - name
      properties:
        chainId:
          type: integer
          description: Blockchain chain id.
          example: 11155111
        name:
          type: string
          description: Human-readable chain name.
          example: Sepolia
    PaymentReceipt:
      type: object
      required:
      - transactionHash
      - blockNumber
      - gasUsed
      properties:
        transactionHash:
          type: string
          description: Confirmed blockchain transaction hash.
        blockNumber:
          type: integer
          description: Block number where the transaction was included.
        gasUsed:
          type: integer
          description: Gas used by the confirmed transaction.
    PaymentHistoryItem:
      type: object
      required:
      - paymentId
      - orderId
      - trackingId
      - status
      - currentStep
      - amount
      - chain
      - updatedAt
      properties:
        paymentId:
          type: string
          description: Payment id visible to the authenticated owner for history and support.
        orderId:
          type: string
          description: Order id visible in the authenticated owner's scope.
        trackingId:
          type: string
          description: Customer-safe checkout tracking id.
        status:
          type: string
          description: Persisted payment status.
          enum:
          - AWAITING_SIGNATURE
          - SUBMITTED
          - CONFIRMING
          - CONFIRMED
          - FAILED
          - EXPIRED
          - REFUNDED
        currentStep:
          type: string
          description: UI-oriented checkout/payment step derived from status.
        pendingAction:
          type: string
          nullable: true
          description: Next expected user or system action, if any.
        amount:
          $ref: '#/components/schemas/CryptoAmount'
        chain:
          $ref: '#/components/schemas/ChainSummary'
        paymentAssetId:
          type: string
          nullable: true
          description: Registry payment asset id selected for the payment.
        txHash:
          type: string
          nullable: true
          description: Submitted blockchain transaction hash, if available.
        receipt:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/PaymentReceipt'
          description: Confirmed receipt summary, or null while pending.
        failureReason:
          type: string
          nullable: true
          description: Safe failure reason when the payment failed.
        updatedAt:
          type: string
          format: date-time
          description: Last payment update timestamp.
    PaymentHistoryResponse:
      type: object
      required:
      - payments
      - pagination
      properties:
        payments:
          type: array
          description: Payment history entries sorted by most recently updated first.
          items:
            $ref: '#/components/schemas/PaymentHistoryItem'
        pagination:
          type: object
          required:
          - limit
          - nextPageToken
          properties:
            limit:
              type: integer
              description: Applied page size.
            nextPageToken:
              type: string
              nullable: true
              description: Reserved for future cursor pagination; currently null.
    LoginChallengeRequest:
      type: object
      additionalProperties: false
      required:
      - walletAddress
      - domain
      - chainId
      properties:
        walletAddress:
          type: string
          description: Wallet address that will sign the SIWE message.
          example: '0x1111111111111111111111111111111111111111'
        domain:
          type: string
          description: SIWE domain expected in the signed message.
          example: token-payments.local
        uri:
          type: string
          description: Optional SIWE URI. Defaults to `https://{domain}` when omitted.
          example: https://token-payments.local
        chainId:
          type: integer
          description: Expected SIWE chain id.
          example: 1337
    LoginSessionRequest:
      type: object
      additionalProperties: false
      required:
      - walletAddress
      - message
      - signature
      - deviceId
      properties:
        walletAddress:
          type: string
          description: Wallet address that requested the challenge.
        message:
          type: string
          description: Exact SIWE signing message returned by the challenge endpoint.
        signature:
          type: string
          description: Personal-sign signature for the SIWE message.
        deviceId:
          type: string
          description: Client device identifier used for session metadata.
    OAuthAuthorizationRequest:
      type: object
      additionalProperties: false
      required:
      - redirectUri
      properties:
        redirectUri:
          type: string
          description: OAuth callback URI registered for the provider.
        mode:
          type: string
          enum:
          - login
          - link
          description: '`login` starts login; `link` requires an authenticated session.'
    OAuthSessionRequest:
      type: object
      additionalProperties: false
      required:
      - code
      - state
      - redirectUri
      - deviceId
      properties:
        code:
          type: string
          description: Provider authorization code.
        state:
          type: string
          description: Opaque OAuth state returned from authorization.
        redirectUri:
          type: string
          description: OAuth callback URI used during authorization.
        deviceId:
          type: string
          description: Client device identifier used for session metadata.
    OAuthLinkRequest:
      type: object
      additionalProperties: false
      required:
      - code
      - state
      - redirectUri
      properties:
        code:
          type: string
          description: Provider authorization code.
        state:
          type: string
          description: Opaque OAuth state returned from authorization.
        redirectUri:
          type: string
          description: OAuth callback URI used during authorization.
        walletId:
          type: string
          description: Optional owned linked wallet id that authorized the link.
    WalletLinkRequest:
      type: object
      additionalProperties: false
      required:
      - walletAddress
      - message
      - signature
      properties:
        walletAddress:
          type: string
          description: Wallet address being linked.
        message:
          type: string
          description: Exact SIWE wallet-link message returned by the challenge endpoint.
        signature:
          type: string
          description: Signature for the wallet-link SIWE message.
        walletType:
          type: string
          description: Wallet type. Defaults to `EOA`.
          example: EOA
    RefreshSessionRequest:
      type: object
      additionalProperties: true
      properties:
        sessionId:
          type: string
          description: Optional session id for non-browser clients that cannot rely on refresh cookie extraction.
        refreshTokenHash:
          type: object
          description: Private harness compatibility shape. Browser clients do not send raw refresh token hashes.
    UserProfileUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          nullable: true
          description: Optional bounded display name.
        userId:
          type: string
          description: Optional target user id. Updating another user requires `user:manage`.
    DeliveryAddressInput:
      type: object
      additionalProperties: true
      required:
      - id
      - street
      properties:
        id:
          type: string
          description: Customer delivery address id.
        street:
          type: string
          description: Street address snapshot.
    OrderItemInput:
      type: object
      additionalProperties: false
      required:
      - productId
      - quantity
      properties:
        productId:
          type: string
          description: Store product id selected for checkout.
        quantity:
          type: integer
          minimum: 1
          description: Positive item quantity.
    OrderCreateRequest:
      type: object
      additionalProperties: false
      required:
      - storeId
      - deliveryAddress
      - items
      properties:
        storeId:
          type: string
          description: Store id used by the current order facade.
        deliveryAddress:
          $ref: '#/components/schemas/DeliveryAddressInput'
        items:
          type: array
          minItems: 1
          description: Order items.
          items:
            $ref: '#/components/schemas/OrderItemInput'
        walletId:
          type: string
          description: Optional linked payer wallet id.
        paymentAssetId:
          type: string
          description: Optional registry payment asset id. Omit to use default asset policy.
        idempotencyKey:
          type: string
          description: Body fallback for Idempotency-Key header.
    PaymentTxHashRequest:
      type: object
      additionalProperties: false
      required:
      - trackingId
      - txHash
      properties:
        trackingId:
          type: string
          description: Customer-safe checkout tracking id.
        txHash:
          type: string
          description: Blockchain transaction hash submitted by the payer wallet.
        idempotencyKey:
          type: string
          description: Body fallback for Idempotency-Key header.
    StoreProfileUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          description: Store display name.
        description:
          type: string
          description: Public store description.
        supportEmail:
          type: string
          description: Support email address.
        supportEmailPublic:
          type: boolean
          description: Whether support email may appear in public profile.
        businessRegistrationLabel:
          type: string
          description: Private merchant business registration label.
        idempotencyKey:
          type: string
          description: Body fallback for Idempotency-Key header.
        commandId:
          type: string
          description: Compatibility command id fallback.
    AdminStoreUserRequest:
      type: object
      additionalProperties: false
      required:
      - walletAddress
      properties:
        walletAddress:
          type: string
          description: Wallet address for the store user to create or reuse.
        idempotencyKey:
          type: string
          description: Body fallback for Idempotency-Key header.
        commandId:
          type: string
          description: Compatibility command id fallback.
    AdminStoreCreateRequest:
      type: object
      additionalProperties: false
      required:
      - ownerUserId
      - storeWalletAddress
      - supportedChainIds
      properties:
        ownerUserId:
          type: string
          description: User id that receives initial merchant owner membership.
        storeWalletAddress:
          type: string
          description: Store settlement wallet compatibility field.
        supportedChainIds:
          type: array
          minItems: 1
          description: Supported EVM chain ids.
          items:
            type: integer
        active:
          type: boolean
          description: Whether the store starts active. Defaults true.
        displayName:
          type: string
          description: Initial public store display name.
        description:
          type: string
          description: Initial public store description.
        supportEmail:
          type: string
          description: Initial support email.
        supportEmailPublic:
          type: boolean
          description: Whether support email is public.
        businessRegistrationLabel:
          type: string
          description: Private business registration label.
        idempotencyKey:
          type: string
          description: Body fallback for Idempotency-Key header.
        commandId:
          type: string
          description: Compatibility command id fallback.
    AdminStoreMembershipRequest:
      type: object
      additionalProperties: false
      required:
      - userId
      properties:
        userId:
          type: string
          description: User receiving merchant membership.
        role:
          type: string
          enum:
          - OWNER
          - MANAGER
          description: Bounded store membership role.
        roleId:
          type: string
          enum:
          - MERCHANT_OWNER
          - MERCHANT_MANAGER
          description: Compatibility merchant role id.
        active:
          type: boolean
          description: Whether membership is active. Defaults true.
        idempotencyKey:
          type: string
          description: Body fallback for Idempotency-Key header.
        commandId:
          type: string
          description: Compatibility command id fallback.
    ProductPriceInput:
      type: object
      required:
      - amount
      - symbol
      - chainId
      - decimals
      properties:
        amount:
          type: string
          description: Decimal amount as a string.
          example: '20.000000000000000000'
        symbol:
          type: string
          description: Asset display symbol.
          example: TPAY
        chainId:
          type: integer
          description: EVM chain id.
          example: 1337
        tokenAddress:
          type: string
          nullable: true
          description: ERC-20 token address, or null for native coin.
        decimals:
          type: integer
          description: Asset decimals.
          example: 18
    ProductCreateRequest:
      type: object
      additionalProperties: false
      required:
      - price
      - initialTotalStock
      oneOf:
      - required:
        - title
      - required:
        - name
      properties:
        title:
          type: string
          description: Product title. Preferred over legacy `name`.
        name:
          type: string
          description: Legacy product name accepted when `title` is omitted.
        description:
          type: string
          description: Product description.
        category:
          type: string
          description: Product category.
        tags:
          type: array
          description: Product tags.
          items:
            type: string
        media:
          type: array
          description: Product media URLs or object keys.
          items:
            type: string
        attributes:
          type: object
          description: Bounded JSON attributes.
          additionalProperties: true
        status:
          $ref: '#/components/schemas/ProductStatus'
        visibility:
          $ref: '#/components/schemas/ProductVisibility'
        price:
          $ref: '#/components/schemas/ProductPriceInput'
        initialTotalStock:
          type: integer
          minimum: 0
          description: Initial inventory total stock.
        active:
          type: boolean
          description: Compatibility active flag.
        available:
          type: boolean
          description: Compatibility available flag.
        idempotencyKey:
          type: string
          description: Body fallback for Idempotency-Key header.
        commandId:
          type: string
          description: Compatibility command id fallback.
    ProductUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          description: Product title.
        description:
          type: string
          description: Product description.
        category:
          type: string
          description: Product category.
        tags:
          type: array
          description: Replacement product tags.
          items:
            type: string
        media:
          type: array
          description: Replacement product media URLs or object keys.
          items:
            type: string
        attributes:
          type: object
          description: Bounded JSON attributes.
          additionalProperties: true
        status:
          $ref: '#/components/schemas/ProductStatus'
        visibility:
          $ref: '#/components/schemas/ProductVisibility'
        price:
          $ref: '#/components/schemas/ProductPriceInput'
        idempotencyKey:
          type: string
          description: Body fallback for Idempotency-Key header.
        commandId:
          type: string
          description: Compatibility command id fallback.
    InventoryIncreaseRequest:
      type: object
      additionalProperties: false
      required:
      - quantity
      - reason
      properties:
        quantity:
          type: integer
          minimum: 1
          description: Quantity to add to total stock.
        reason:
          type: string
          description: Audit reason for stock intake.
        idempotencyKey:
          type: string
          description: Body fallback for Idempotency-Key header.
    InventoryCorrectionRequest:
      type: object
      additionalProperties: false
      required:
      - targetTotalStock
      - reason
      properties:
        targetTotalStock:
          type: integer
          minimum: 0
          description: Target total stock after correction. Cannot be below reserved stock.
        reason:
          type: string
          description: Audit reason for stock correction.
        idempotencyKey:
          type: string
          description: Body fallback for Idempotency-Key header.
    InventorySaleToggleRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          description: Audit reason for sale pause/resume.
        idempotencyKey:
          type: string
          description: Body fallback for Idempotency-Key header.
    MerchantInvitationCreateRequest:
      type: object
      additionalProperties: false
      required:
      - roleId
      anyOf:
      - required:
        - targetUserId
      - required:
        - targetWallet
      - required:
        - targetDisplayName
      properties:
        roleId:
          type: string
          description: Server-defined merchant role template, excluding owner transfer.
        targetUserId:
          type: string
          description: Existing user id target.
        targetWallet:
          type: string
          description: Wallet address invitation target.
        targetDisplayName:
          type: string
          description: Display-name-resolved target.
        expiresAt:
          type: string
          format: date-time
          description: Optional invitation expiry.
    MerchantInvitationAcceptRequest:
      type: object
      additionalProperties: false
      properties:
        walletAddress:
          type: string
          description: Optional wallet address proof used by the invite target.
    MerchantMemberRoleUpdateRequest:
      type: object
      additionalProperties: false
      required:
      - roleId
      properties:
        roleId:
          type: string
          description: New non-owner merchant staff role template.
    OperatorCancelOrderRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          description: Audit reason for cancellation.
        idempotencyKey:
          type: string
          description: Body fallback for Idempotency-Key header.
        parameters:
          type: object
          description: Optional JSON action parameters.
          additionalProperties: true
    OperatorOutboxActionRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      oneOf:
      - required:
        - kind
      - required:
        - messageKind
      properties:
        kind:
          $ref: '#/components/schemas/OutboxMessageKind'
        messageKind:
          $ref: '#/components/schemas/OutboxMessageKind'
        reason:
          type: string
          description: Audit reason for retry/replay.
        idempotencyKey:
          type: string
          description: Body fallback for Idempotency-Key header.
        parameters:
          type: object
          description: Optional JSON action parameters.
          additionalProperties: true
    ProductStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
      description: Catalog product status.
    ProductVisibility:
      type: string
      enum:
      - PUBLIC
      - PRIVATE
      description: Catalog product visibility.
    OutboxMessageKind:
      type: string
      enum:
      - EVENT
      - COMMAND
      description: Outbox/message kind.
