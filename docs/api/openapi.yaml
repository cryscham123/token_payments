components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access
      description: Signed HttpOnly access session cookie set by the auth API.
      x-gitbook-description-html: <p>Signed HttpOnly access session cookie set by the auth API.</p>
    bearerAuth:
      type: http
      scheme: bearer
      description: Local integration fallback for explicit non-browser runtime paths.
      x-gitbook-description-html: <p>Local integration fallback for explicit non-browser runtime paths.</p>
  parameters:
    provider:
      name: provider
      in: path
      required: true
      description: OAuth provider key.
      schema:
        type: string
        example: google
    oauthIdentityId:
      name: oauthIdentityId
      in: path
      required: true
      description: Public OAuth identity id.
      schema:
        type: string
    walletId:
      name: walletId
      in: path
      required: true
      description: Public linked wallet id.
      schema:
        type: string
    trackingId:
      name: trackingId
      in: path
      required: true
      description: Customer-safe checkout tracking id.
      schema:
        type: string
    orderId:
      name: orderId
      in: path
      required: true
      description: Order id visible in the caller's allowed scope.
      schema:
        type: string
    paymentId:
      name: paymentId
      in: path
      required: true
      description: Payment id visible to operator policy.
      schema:
        type: string
    messageId:
      name: messageId
      in: path
      required: true
      description: Outbox or message id visible to operator policy.
      schema:
        type: string
    publicStoreId:
      name: publicStoreId
      in: path
      required: true
      description: Stable public store id.
      schema:
        type: string
        example: store_demo
    publicProductId:
      name: publicProductId
      in: path
      required: true
      description: Stable public product id scoped to the public store.
      schema:
        type: string
        example: product_demo
    storeId:
      name: storeId
      in: path
      required: true
      description: Store id accepted by merchant/admin compatibility routes.
      schema:
        type: string
    productId:
      name: productId
      in: path
      required: true
      description: Product id accepted by inventory command routes.
      schema:
        type: string
    invitationId:
      name: invitationId
      in: path
      required: true
      description: Merchant invitation id.
      schema:
        type: string
    userId:
      name: userId
      in: path
      required: true
      description: User id in merchant membership scope.
      schema:
        type: string
    storeIdQuery:
      name: storeId
      in: query
      required: false
      description: Optional store filter for inventory rows.
      schema:
        type: string
    category:
      name: category
      in: query
      required: false
      description: Bounded product category filter.
      schema:
        type: string
    tag:
      name: tag
      in: query
      required: false
      description: Bounded product tag filter.
      schema:
        type: string
    status:
      name: status
      in: query
      required: false
      description: Merchant product status filter.
      schema:
        type: string
    visibility:
      name: visibility
      in: query
      required: false
      description: Merchant product visibility filter.
      schema:
        type: string
    sort:
      name: sort
      in: query
      required: false
      description: Allowlisted sort key. Catalog supports `title`, `createdAt`, `updatedAt`, `price` with optional `-` prefix.
      schema:
        type: string
        example: -updatedAt
    limit:
      name: limit
      in: query
      required: false
      description: Bounded page size. Public and merchant catalog routes currently accept 1 through 50.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    offset:
      name: offset
      in: query
      required: false
      description: Page offset.
      schema:
        type: integer
        minimum: 0
        default: 0
    XRequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: Optional client-supplied request correlation id. Responses preserve or generate a request id.
      schema:
        type: string
        example: postman-request-001
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: Required for idempotent command routes unless `idempotencyKey` or `commandId` is supplied in the JSON body.
      schema:
        type: string
        example: postman-command-001
    CsrfTokenHeader:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for browser cookie-authenticated mutating requests. Non-browser bearer/local harness flows may
        not need it.
      schema:
        type: string
        example: '{{csrfToken}}'
    LocalUserIdHeader:
      name: X-User-Id
      in: header
      required: false
      description: Local/dev fallback actor id only. Live or production paths must not trust this header.
      schema:
        type: string
        example: user-001
    LocalScopesHeader:
      name: X-User-Scopes
      in: header
      required: false
      description: Local/dev fallback comma-separated scope list only. Live or production paths must not trust this header.
      schema:
        type: string
        example: user:self,store:read
    q:
      name: q
      in: query
      required: false
      description: Bounded product search text. Empty strings, control characters, and overlong values are rejected.
      schema:
        type: string
        maxLength: 120
    context:
      name: context
      in: query
      required: false
      description: Comma-separated operator dashboard contexts. Use `orders`, `payments`, and/or `outbox`.
      schema:
        type: string
        example: orders,payments,outbox
    contexts:
      name: contexts
      in: query
      required: false
      description: Alias for `context`.
      schema:
        type: string
        example: orders,payments,outbox
    operatorStatus:
      name: status
      in: query
      required: false
      description: Comma-separated operator status filter.
      schema:
        type: string
        example: FAILED,PENDING
    chainIdQuery:
      name: chainId
      in: query
      required: false
      description: Numeric chain id filter.
      schema:
        type: integer
        example: 1337
    failedOnly:
      name: failedOnly
      in: query
      required: false
      description: When true, returns only failed operator records.
      schema:
        type: boolean
        default: false
    retryCandidatesOnly:
      name: retryCandidatesOnly
      in: query
      required: false
      description: When true, returns only retryable outbox candidates.
      schema:
        type: boolean
        default: false
    pageToken:
      name: pageToken
      in: query
      required: false
      description: Opaque operator pagination token.
      schema:
        type: string
    outboxKind:
      name: kind
      in: query
      required: false
      description: Outbox message kind. Defaults to `EVENT`.
      schema:
        $ref: '#/components/schemas/OutboxMessageKind'
    userIdQuery:
      name: userId
      in: query
      required: false
      description: Optional user id fallback. Updating or reading another user requires the matching management permission.
      schema:
        type: string
  requestBodies:
    LoginChallengeRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginChallengeRequest'
          example:
            walletAddress: '0x1111111111111111111111111111111111111111'
            domain: token-payments.local
            uri: https://token-payments.local
            chainId: 1337
    LoginSessionRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginSessionRequest'
          example:
            walletAddress: '0x1111111111111111111111111111111111111111'
            message: <siwe-message>
            signature: 0xsignature
            deviceId: browser-1
    OrderCreateRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderCreateRequest'
          example:
            storeId: store-001
            deliveryAddress:
              id: addr-001
              street: 1 Token St
            items:
            - productId: product-001
              quantity: 2
            paymentAssetId: native:1337
            walletId: wallet-001
    PaymentTxHashRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentTxHashRequest'
          example:
            trackingId: tracking-001
            txHash: 0xtransactionhash
    StoreProfileUpdateRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StoreProfileUpdateRequest'
          example:
            displayName: Demo Store
            description: Local token payments demo store
            supportEmailPublic: false
    OAuthAuthorizationRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthAuthorizationRequest'
