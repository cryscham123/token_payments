    OAuthSessionRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthSessionRequest'
          example:
            code: oauth-code
            state: oauth-state
            redirectUri: https://token-payments.local/oauth/callback
            deviceId: browser-1
    OAuthLinkRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OAuthLinkRequest'
