              example:
                error:
                  code: USER_PROFILE_NOT_FOUND
                  message: The requested resource does not exist or is not visible in the caller scope.
                  status: 404
        '413':
          description: Request body exceeds the bounded JSON body size policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
