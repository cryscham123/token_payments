  /auth/oauth/{provider}/authorize:
    post:
      summary: Request OAuth authorization
      description: Starts provider-subject OAuth authorization without trusting email matching.
      tags:
      - oauth
      operationId: requestOAuthAuthorization
      security: []
      requestBody:
        $ref: '#/components/requestBodies/OAuthAuthorizationRequest'
      responses:
        '201':
          description: Resource or command record created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonObject'
              example:
                oauthAuthorization:
                  provider: google
                  authorizationUrl: <provider-authorization-url>
                  state: <redacted-oauth-state>
                  mode: login
                  expiresAt: <timestamp>
                  pkceRequired: true
        '400':
          description: 'Validation error, malformed JSON, missing required input, unsupported enum, or rejected request shape.
            Possible error codes: VALIDATION_ERROR, OAUTH_PROVIDER_UNSUPPORTED.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Validation error, malformed JSON, missing required input, unsupported enum, or rejected request
                    shape.
                  status: 400
        '401':
          description: 'Authentication is missing, invalid, expired, or required for the requested operation. Possible error
            codes: AUTHENTICATION_REQUIRED.'
          content:
